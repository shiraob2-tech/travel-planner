<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b67"><title>旅プランナー</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#183332;background:#f5f8f7}*{box-sizing:border-box}body{margin:0}header{background:#176b67;color:white;padding:20px 16px 14px}h1{font-size:22px;margin:0}small{opacity:.8}.wrap{max-width:780px;margin:auto;padding:12px 12px 90px}.card{background:white;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 9px #173b3420}h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px}label{display:block;font-size:13px;margin:10px 0 4px;font-weight:600}input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #cbdad5;border-radius:9px;background:white}textarea{min-height:75px}button,.btn{border:0;border-radius:9px;padding:11px 13px;background:#176b67;color:white;font:inherit;cursor:pointer;text-decoration:none;display:inline-block;margin:5px 5px 5px 0}button.secondary,.btn.secondary{background:#e7f0ee;color:#175b58}button.danger{background:#a63434}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;overflow-x:auto;border-top:1px solid #dce8e4;padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;min-width:75px;background:white;color:#48635f;font-size:12px;padding:12px 3px;margin:0;border-radius:0}nav button.active{color:#176b67;background:#e4f2ee;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:#647a75;font-size:13px}.item{padding:10px 0;border-bottom:1px solid #e4ece9;overflow-wrap:anywhere}.item:last-child{border:0}.pill{background:#e8f3ef;border-radius:20px;padding:4px 9px;font-size:12px}.photo{max-width:100%;max-height:250px;border-radius:9px}.hide{display:none}.empty{padding:16px;color:#71827e;text-align:center}a{color:#176b67}input[type=checkbox]{width:auto;transform:scale(1.3);margin-right:10px}@media(max-width:380px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>✈️ 旅プランナー</h1><small>個人・夫婦の旅行をひとまとめに</small></header><main class="wrap"><section id="content"></section></main><nav id="nav"></nav><script>
const KEY='tabiplanner-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{trips:[],active:null}}catch{state={trips:[],active:null}}let tab='旅行';const tabs=['旅行','日程','予約','費用','記録','持ち物'];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('保存容量が不足しました。写真を減らすかバックアップしてください。');return false}};const trip=()=>state.trips.find(t=>t.id===state.active);const fmt=n=>Number(n||0).toLocaleString('ja-JP');const field=(name,label,type='text',required=false)=>`<label>${label}<input name="${name}" type="${type}" ${required?'required':''}></label>`;const area=(name,label)=>`<label>${label}<textarea name="${name}"></textarea></label>`;const formData=f=>Object.fromEntries(new FormData(f));const newItem=(key,obj)=>{trip()[key].push({id:id(),...obj});save();render()};function render(){let nav=$('#nav');nav.innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let c=$('#content');if(tab==='旅行')return renderTrips(c);if(!trip()){c.innerHTML='<div class="card empty">まず「旅行」から新しい旅行を登録してください。</div>';return}({日程:renderSchedule,予約:renderBooking,費用:renderCost,記録:renderDiary,持ち物:renderPacking})[tab](c)}function renderTrips(c){let t=trip();c.innerHTML=`<div class="card"><h2>旅行を選ぶ</h2><select id="tripselect"><option value="">旅行を選択</option>${state.trips.map(x=>`<option value="${x.id}" ${x.id===state.active?'selected':''}>${esc(x.name)} (${esc(x.start)}〜${esc(x.end)})</option>`).join('')}</select>${t?`<p><b>${esc(t.name)}</b>　${esc(t.destination)}</p><p class="muted">${esc(t.start)} 〜 ${esc(t.end)} ／ 予算 ¥${fmt(t.budget)}</p><p>${esc(t.memo)}</p><button class="secondary" id="backup">データをバックアップ</button><button class="secondary" id="ics">予定をカレンダーファイルに出力</button><button class="danger" id="deltrip">この旅行を削除</button>`:''}</div><div class="card"><h2>新しい旅行を作成</h2><form id="tripform">${field('name','旅行名','text',true)}${field('destination','目的地','text',true)}<div class="grid">${field('start','出発日','date',true)}${field('end','帰宅日','date',true)}</div>${field('budget','旅行予算（円）','number')}${area('memo','メモ')}<button>旅行を登録</button></form></div><div class="card"><h2>バックアップから復元</h2><input id="restore" type="file" accept="application/json"><p class="muted">この端末のブラウザー内に保存します。機種変更やブラウザーデータ削除に備え、定期的にバックアップしてください。</p></div>`;$('#tripselect').onchange=e=>{state.active=e.target.value;save();render()};$('#tripform').onsubmit=e=>{e.preventDefault();let x=formData(e.target);if(x.end<x.start)return alert('帰宅日は出発日以降にしてください');let t={...x,id:id(),schedule:[],bookings:[],costs:[],diary:[],packing:[]};state.trips.push(t);state.active=t.id;save();render()};if(t){$('#backup').onclick=()=>download('旅プランナー-バックアップ.json',JSON.stringify(state,null,2),'application/json');$('#ics').onclick=exportIcs;$('#deltrip').onclick=()=>{if(confirm('この旅行と登録内容を削除しますか？')){state.trips=state.trips.filter(x=>x.id!==t.id);state.active=state.trips[0]?.id||null;save();render()}}}$('#restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.trips))throw Error();if(confirm('現在のデータをバックアップの内容で置き換えますか？')){state=data;save();render()}}catch{alert('バックアップファイルを読み取れませんでした')}}}
function deleteButton(key,item){return `<button class="secondary" data-del="${key}" data-id="${item.id}">削除</button>`}function bindDelete(){document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('この項目を削除しますか？')){let k=b.dataset.del;trip()[k]=trip()[k].filter(x=>x.id!==b.dataset.id);save();render()}})}function renderSchedule(c){let t=trip();c.innerHTML=`<div class="card"><h2>日別スケジュール</h2><form id="f">${field('date','日付','date',true)}${field('time','時刻','time',true)}${field('title','予定・観光地','text',true)}${field('place','場所・住所')}${area('note','メモ')}<button>予定を追加</button></form></div><div class="card"><h2>登録した予定</h2>${[...t.schedule].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(x=>`<div class="item"><b>${esc(x.date)} ${esc(x.time)}　${esc(x.title)}</b><p>${esc(x.place)}　${x.place?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.place)}">地図で開く</a>`:''}</p><p class="muted">${esc(x.note)}</p><a class="btn secondary" target="_blank" rel="noopener" href="${calendarUrl(x)}">Googleカレンダーに追加</a>${deleteButton('schedule',x)}</div>`).join('')||'<div class="empty">予定はまだありません</div>'}</div>`;$('#f').onsubmit=e=>{e.preventDefault();newItem('schedule',formData(e.target))};bindDelete()}
function calendarUrl(x){let d=(x.date||'').replace(/-/g,'');let start=d+'T'+(x.time||'09:00').replace(':','')+'00';let hh=+(x.time||'09:00').slice(0,2),mm=+(x.time||'09:00').slice(3,5);let end=new Date(`${x.date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00`);end.setHours(end.getHours()+1);let endstr=[end.getFullYear(),String(end.getMonth()+1).padStart(2,'0'),String(end.getDate()).padStart(2,'0')].join('')+'T'+String(end.getHours()).padStart(2,'0')+String(end.getMinutes()).padStart(2,'0')+'00';return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(x.title)+'&dates='+start+'/'+endstr+'&ctz=Asia%2FTokyo&details='+encodeURIComponent(x.note||'')+'&location='+encodeURIComponent(x.place||'')}
function renderBooking(c){c.innerHTML=`<div class="card"><h2>宿泊・交通予約</h2><form id="f"><label>種類<select name="kind"><option>ホテル</option><option>鉄道</option><option>飛行機</option><option>バス</option><option>レンタカー</option><option>その他</option></select></label>${field('date','利用日','date',true)}${field('name','施設名・便名','text',true)}${field('number','予約番号')}${field('amount','予約金額（円）','number')}${area('note','連絡先・メモ')}<button>予約を登録</button></form></div><div class="card"><h2>予約一覧</h2>${trip().bookings.map(x=>`<div class="item"><b>${esc(x.date)}　${esc(x.kind)}　${esc(x.name)}</b><p>予約番号：${esc(x.number)} ／ ¥${fmt(x.amount)}</p><p class="muted">${esc(x.note)}</p>${deleteButton('bookings',x)}</div>`).join('')||'<div class="empty">予約情報はまだありません</div>'}</div>`;$('#f').onsubmit=e=>{e.preventDefault();newItem('bookings',formData(e.target))};bindDelete()}
function renderCost(c){let t=trip(),spent=t.costs.reduce((s,x)=>s+Number(x.amount||0),0);c.innerHTML=`<div class="card"><h2>旅行費用</h2><p>予算 <b>¥${fmt(t.budget)}</b>　支出 <b>¥${fmt(spent)}</b></p><p>残り <b>¥${fmt(Number(t.budget||0)-spent)}</b></p><p class="muted">予約金額は二重計上を避けるため、費用に自動加算しません。</p><form id="f">${field('date','日付','date',true)}<label>費目<select name="category"><option>交通費</option><option>宿泊費</option><option>食費</option><option>観光</option><option>買い物</option><option>その他</option></select></label>${field('amount','金額（円）','number',true)}${field('note','内容')}<button>支出を追加</button></form></div><div class="card"><h2>支出一覧</h2>${t.costs.map(x=>`<div class="item"><b>${esc(x.date)}　${esc(x.category)}　¥${fmt(x.amount)}</b><p class="muted">${esc(x.note)}</p>${deleteButton('costs',x)}</div>`).join('')||'<div class="empty">支出はまだありません</div>'}</div>`;$('#f').onsubmit=e=>{e.preventDefault();newItem('costs',formData(e.target))};bindDelete()}
function renderDiary(c){c.innerHTML=`<div class="card"><h2>写真・旅行記録</h2><form id="f">${field('date','日付','date',true)}${field('title','タイトル','text',true)}${area('note','感想・旅行記')}<label>写真（容量を節約するため縮小して保存）<input name="photo" type="file" accept="image/*"></label><button>記録を保存</button></form></div><div class="card"><h2>旅行の思い出</h2>${trip().diary.map(x=>`<div class="item"><b>${esc(x.date)}　${esc(x.title)}</b><p>${esc(x.note)}</p>${x.photo?`<img class="photo" src="${x.photo}" alt="旅行の写真">`:''}<div>${deleteButton('diary',x)}</div></div>`).join('')||'<div class="empty">旅行記録はまだありません</div>'}</div>`;$('#f').onsubmit=async e=>{e.preventDefault();let data=formData(e.target),file=e.target.elements.photo.files[0];delete data.photo;if(file){if(!file.type.startsWith('image/'))return alert('画像ファイルを選択してください');try{data.photo=await resizeImage(file)}catch{return alert('写真を読み込めませんでした')}}newItem('diary',data)};bindDelete()}
function resizeImage(file){return new Promise((resolve,reject)=>{let url=URL.createObjectURL(file),img=new Image();img.onload=()=>{let scale=Math.min(1,900/Math.max(img.width,img.height));let cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*scale));cv.height=Math.max(1,Math.round(img.height*scale));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);resolve(cv.toDataURL('image/jpeg',.65))};img.onerror=()=>{URL.revokeObjectURL(url);reject()};img.src=url})}
function renderPacking(c){let p=trip().packing;c.innerHTML=`<div class="card"><h2>持ち物チェック</h2><p class="muted">${p.filter(x=>x.done).length} / ${p.length} 個 準備完了</p><form id="f">${field('name','持ち物','text',true)}<button>追加</button></form></div><div class="card">${p.map(x=>`<div class="item row"><label style="flex:1;margin:0"><input type="checkbox" data-check="${x.id}" ${x.done?'checked':''}><span style="${x.done?'text-decoration:line-through;color:#888':''}">${esc(x.name)}</span></label>${deleteButton('packing',x)}</div>`).join('')||'<div class="empty">持ち物はまだありません</div>'}</div>`;$('#f').onsubmit=e=>{e.preventDefault();newItem('packing',{...formData(e.target),done:false})};document.querySelectorAll('[data-check]').forEach(x=>x.onchange=e=>{let item=p.find(y=>y.id===x.dataset.check);item.done=e.target.checked;save();render()});bindDelete()}
function download(name,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function exportIcs(){let t=trip(),lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tabi Planner//JA'];const ics=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');for(let x of t.schedule){let dt=x.date.replace(/-/g,'')+'T'+x.time.replace(':','')+'00';let d=new Date(x.date+'T'+x.time+':00');d.setHours(d.getHours()+1);let end=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';lines.push('BEGIN:VEVENT','UID:'+x.id+'@tabiplanner','DTSTART;TZID=Asia/Tokyo:'+dt,'DTEND;TZID=Asia/Tokyo:'+end,'SUMMARY:'+ics(x.title),'LOCATION:'+ics(x.place),'DESCRIPTION:'+ics(x.note),'END:VEVENT')}lines.push('END:VCALENDAR');download('旅行予定.ics',lines.join('\r\n'),'text/calendar;charset=utf-8')}
render();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.warn)); }
</script></body></html>
