<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b67"><title>旅プランナー</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#183332;background:#f5f8f7}*{box-sizing:border-box}body{margin:0}header{background:#176b67;color:white;padding:20px 16px 14px}h1{font-size:22px;margin:0}small{opacity:.8}.wrap{max-width:780px;margin:auto;padding:12px 12px 90px}.card{background:white;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 9px #173b3420}h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px}label{display:block;font-size:13px;margin:10px 0 4px;font-weight:600}input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #cbdad5;border-radius:9px;background:white}textarea{min-height:75px}button,.btn{border:0;border-radius:9px;padding:11px 13px;background:#176b67;color:white;font:inherit;cursor:pointer;text-decoration:none;display:inline-block;margin:5px 5px 5px 0}button.secondary,.btn.secondary{background:#e7f0ee;color:#175b58}button.danger{background:#a63434}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;overflow-x:auto;border-top:1px solid #dce8e4;padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;min-width:75px;background:white;color:#48635f;font-size:12px;padding:12px 3px;margin:0;border-radius:0}nav button.active{color:#176b67;background:#e4f2ee;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:#647a75;font-size:13px}.item{padding:10px 0;border-bottom:1px solid #e4ece9;overflow-wrap:anywhere}.item:last-child{border:0}.pill{background:#e8f3ef;border-radius:20px;padding:4px 9px;font-size:12px}.photo{max-width:100%;max-height:250px;border-radius:9px}.hide{display:none}.empty{padding:16px;color:#71827e;text-align:center}a{color:#176b67}input[type=checkbox]{width:auto;transform:scale(1.3);margin-right:10px}@media(max-width:380px){.grid{grid-template-columns:1fr}}</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><header><h1>✈️ 旅プランナー</h1><small>個人・夫婦の旅行をひとまとめに</small></header><main class="wrap"><section id="content"></section></main><nav id="nav"></nav><script>
const KEY='tabiplanner-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{trips:[],active:null}}catch{state={trips:[],active:null}}let tab='旅行';const tabs=['旅行','日程','予約','費用','記録','持ち物','地図','同期','レポート'];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));scheduleDrive();return true}catch(e){alert('保存容量が不足しました。写真を減らすかバックアップしてください。');return false}};const trip=()=>state.trips.find(t=>t.id===state.active);const fmt=n=>Number(n||0).toLocaleString('ja-JP');const field=(name,label,type='text',required=false)=>`<label>${label}<input name="${name}" type="${type}" ${required?'required':''}></label>`;const area=(name,label)=>`<label>${label}<textarea name="${name}"></textarea></label>`;const formData=f=>Object.fromEntries(new FormData(f));const newItem=(key,obj)=>{trip()[key].push({id:id(),...obj,...(key==='schedule'?{modifiedAt:new Date().toISOString()}: {})});save();render();if(key==='schedule')scheduleSync()};function render(){let nav=$('#nav');nav.innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let c=$('#content');if(tab==='同期')return renderSync(c);if(tab==='旅行')return renderTrips(c);if(!trip()){c.innerHTML='<div class="card empty">まず「旅行」から新しい旅行を登録してください。</div>';return}({日程:renderSchedule,予約:renderBooking,費用:renderCost,記録:renderDiary,持ち物:renderPacking,地図:renderMap,レポート:renderReport})[tab](c)}function renderTrips(c){let t=trip();c.innerHTML=`<div class="card"><h2>旅行を選ぶ</h2><select id="tripselect"><option value="">旅行を選択</option>${state.trips.map(x=>`<option value="${x.id}" ${x.id===state.active?'selected':''}>${esc(x.name)} (${esc(x.start)}〜${esc(x.end)})</option>`).join('')}</select>${t?`<p><b>${esc(t.name)}</b>　${esc(t.destination)}</p><p class="muted">${esc(t.start)} 〜 ${esc(t.end)} ／ 予算 ¥${fmt(t.budget)}</p><p>${esc(t.memo)}</p><button class="secondary" id="edittrip">旅行を編集</button><button class="secondary" id="backup">データをバックアップ</button><button class="secondary" id="ics">予定をカレンダーファイルに出力</button><button class="danger" id="deltrip">この旅行を削除</button>`:''}</div><div class="card"><h2>新しい旅行を作成</h2><form id="tripform">${field('name','旅行名','text',true)}${field('destination','目的地','text',true)}<div class="grid">${field('start','出発日','date',true)}${field('end','帰宅日','date',true)}</div>${field('budget','旅行予算（円）','number')}${area('memo','メモ')}<button>旅行を登録</button></form></div><div class="card"><h2>バックアップから復元</h2><input id="restore" type="file" accept="application/json"><p class="muted">この端末のブラウザー内に保存します。機種変更やブラウザーデータ削除に備え、定期的にバックアップしてください。</p></div>`;$('#tripselect').onchange=e=>{state.active=e.target.value;save();render()};$('#tripform').onsubmit=e=>{e.preventDefault();let x=formData(e.target);if(x.end<x.start)return alert('帰宅日は出発日以降にしてください');let t={...x,id:id(),schedule:[],bookings:[],costs:[],diary:[],packing:[]};state.trips.push(t);state.active=t.id;save();render()};if(t){$('#edittrip').onclick=()=>editTrip(t);$('#backup').onclick=()=>download('旅プランナー-バックアップ.json',JSON.stringify(state,null,2),'application/json');$('#ics').onclick=exportIcs;$('#deltrip').onclick=()=>{if(confirm('この旅行と登録内容を削除しますか？')){state.trips=state.trips.filter(x=>x.id!==t.id);state.active=state.trips[0]?.id||null;save();render()}}}$('#restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.trips))throw Error();if(confirm('現在のデータをバックアップの内容で置き換えますか？')){state=data;save();render()}}catch{alert('バックアップファイルを読み取れませんでした')}}}
function editTrip(tripToEdit) {
 const dialog = document.createElement('dialog');
 dialog.style.width = 'min(90vw, 520px)';
 dialog.style.maxHeight = '85dvh';
 dialog.innerHTML = `<h2>旅行を編集</h2><form>
 ${field('name','旅行名','text',true)}
 ${field('destination','目的地','text',true)}
 <div class="grid">${field('start','出発日','date',true)}${field('end','帰宅日','date',true)}</div>
 ${field('budget','旅行予算（円）','number')}
 ${area('memo','メモ')}
 <p role="status"></p>
 <button type="submit">変更を保存</button>
 <button type="button" class="secondary">キャンセル</button>
 </form>`;
 const form = dialog.querySelector('form');
 const status = form.querySelector('[role="status"]');
 const original = Object.fromEntries([...form.elements]
  .filter(input => input.name)
  .map(input => [input.name, tripToEdit[input.name] ?? '']));
 for (const [name,value] of Object.entries(original)) form.elements.namedItem(name).value=value;
 dialog.querySelector('button[type="button"]').onclick=()=>dialog.close();
 dialog.addEventListener('close',()=>dialog.remove(),{once:true});
 form.onsubmit=event=>{
  event.preventDefault();
  const changes=formData(form);
  if(!changes.name.trim()||!changes.destination.trim()||changes.end<changes.start){
   status.textContent='旅行名・目的地を入力し、帰宅日を出発日以降にしてください。';
   return;
  }
  const current=state.trips.find(item=>item.id===tripToEdit.id);
  if(!current||Object.entries(original).some(([name,value])=>(current[name]??'')!==value)){
   status.textContent='旅行情報が別の端末で更新された可能性があります。編集を開き直してください。';
   return;
  }
  const previous={...current};
  Object.assign(current,changes);
  if(!save()){
   for(const name of Object.keys(changes)){
    if(Object.hasOwn(previous,name))current[name]=previous[name];
    else delete current[name];
   }
   return;
  }
  dialog.close();
  render();
 };
 document.body.append(dialog);
 dialog.showModal();
}

function deleteButton(key,item){return `<button class="secondary" data-del="${key}" data-id="${item.id}">削除</button>`}function bindDelete(){document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('この項目を削除しますか？')){let k=b.dataset.del;if(k==='schedule'){let item=trip()[k].find(x=>x.id===b.dataset.id);if(item?.googleEventId){state.syncDeletes=state.syncDeletes||[];state.syncDeletes.push({eventId:item.googleEventId,tripId:trip().id})}}trip()[k]=trip()[k].filter(x=>x.id!==b.dataset.id);save();render();if(k==='schedule')scheduleSync()}})}function bindAddressLookup(form) {
 const title = form.elements.namedItem('title');
 const place = form.elements.namedItem('place');
 const button = form.querySelector('#lookup-address');
 const status = form.querySelector('#address-status');
 const results = form.querySelector('#address-results');

 title.addEventListener('input', () => {
  results.replaceChildren();
  status.textContent = '';
 });

 button.onclick = async () => {
  const query = title.value.trim();
  results.replaceChildren();
  if (!query) {
   status.textContent = '「予定・観光地」に目的地名を入力してください。';
   title.focus();
   return;
  }

  button.disabled = true;
  status.textContent = '住所を検索しています。';
  try {
   const url = new URL('https://photon.komoot.io/api/');
   url.search = new URLSearchParams({q:query, limit:'5'});
   const response = await fetch(url, {signal:AbortSignal.timeout(10000)});
   if (!response.ok) throw new Error('Address search failed');
   const data = await response.json();
   if (title.value.trim() !== query) return;

   const labels = new Set();
   for (const {properties: p} of data.features) {
    const isJapan = p.countrycode?.toUpperCase() === 'JP';
    const street = [p.street, p.housenumber].filter(Boolean).join(' ');
    const parts = isJapan
     ? [p.state, p.county, p.city, p.district, p.locality, p.street, p.housenumber]
     : [street, p.locality, p.district, p.city, p.state, p.postcode, p.country];
    const address = [...new Set(parts.filter(Boolean))].join(' ');
    const label = [p.name, address].filter(Boolean).join(' — ');
    if (!label || labels.has(label)) continue;
    labels.add(label);

    if (!p.housenumber || !(p.city || p.district || p.locality)) {
     const link = document.createElement('a');
     link.className = 'btn secondary';
     link.href = mapsPlaceUrl([p.name || query, p.city, p.state].filter(Boolean).join(' '));
     link.target = '_blank';
     link.rel = 'noopener noreferrer';
     link.textContent = label + '（番地未確認・地図で確認）';
     results.append(link);
     continue;
    }

    const candidate = document.createElement('button');
    candidate.type = 'button';
    candidate.className = 'secondary';
    candidate.textContent = label;
    candidate.onclick = () => {
     place.value = address;
     results.replaceChildren();
     status.textContent = '候補の住所を入力しました。番地を確認し、必要に応じて修正してください。';
     place.focus();
    };
    results.append(candidate);
   }

   status.textContent = labels.size
    ? '住所候補を選べます。番地未確認の候補は地図で住所を確認し、直接入力してください。'
    : '住所が見つかりませんでした。施設名に市町村名を加えて検索するか、住所を直接入力してください。';
   if (labels.size) {
    const attribution = document.createElement('a');
    attribution.href = 'https://www.openstreetmap.org/copyright';
    attribution.target = '_blank';
    attribution.rel = 'noopener noreferrer';
    attribution.textContent = '© OpenStreetMap contributors';
    results.append(attribution);
   }
  } catch {
   if (title.value.trim() === query) {
    status.textContent = '住所検索に接続できませんでした。再検索するか、住所を直接入力してください。';
   }
  } finally {
   button.disabled = false;
  }
 };
}

function renderSchedule(c){let t=trip();c.innerHTML=`<div class="card"><h2>日別スケジュール</h2><form id="f">${field('date','日付','date',true)}${field('time','時刻','time',true)}${field('title','予定・観光地','text',true)}<button type="button" class="secondary" id="lookup-address">目的地名で住所を検索</button>
<p id="address-status" class="muted" role="status"></p>
<div id="address-results"></div>
${field('place','場所・住所')}${area('note','メモ')}<button>予定を追加</button></form></div><div class="card"><h2>登録した予定</h2>${[...t.schedule].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(x=>`<div class="item"><b>${esc(x.date)} ${esc(x.time)}　${esc(x.title)}</b><p>${esc(x.place)}　${x.place?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.place)}">地図で開く</a>`:''}</p><p class="muted">${esc(x.note)}</p><a class="btn secondary" target="_blank" rel="noopener" href="${calendarUrl(x)}">Googleカレンダーに追加</a><button class="secondary" data-edit="${x.id}">編集</button>${deleteButton('schedule',x)}</div>`).join('')||'<div class="empty">予定はまだありません</div>'}</div>`;$('#f').onsubmit=e=>{e.preventDefault();newItem('schedule',formData(e.target))};bindAddressLookup($('#f'));bindDelete();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let x=t.schedule.find(i=>i.id===b.dataset.edit);if(!x)return;let date=prompt('日付（YYYY-MM-DD）',x.date);if(date===null)return;let time=prompt('時刻（HH:MM）',x.time);if(time===null)return;let title=prompt('予定・観光地',x.title);if(title===null)return;let place=prompt('場所・住所',x.place||'');if(place===null)return;let note=prompt('メモ',x.note||'');if(note===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)||!title.trim())return alert('日付・時刻・予定を確認してください');Object.assign(x,{date,time,title,place,note,modifiedAt:new Date().toISOString()});save();render();scheduleSync()})}

// 地図・経路：Googleマップの公式Maps URLsを利用。APIキーは不要です。
const mapsPlaceUrl=place=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(place);
function mapsDirectionsUrl(stops,mode){
 const places=stops.map(x=>x.place.trim());
 if(places.length<2)return mapsPlaceUrl(places[0]||'');
 const params=new URLSearchParams({api:'1',origin:places[0],destination:places[places.length-1],travelmode:mode});
 if(places.length>2)params.set('waypoints',places.slice(1,-1).join('|'));
 return 'https://www.google.com/maps/dir/?'+params.toString();
}
function renderMap(c){
 const t=trip();
 const dates=[...new Set(t.schedule.filter(x=>x.date&&x.place?.trim()).map(x=>x.date))].sort();
 const selected=window.mapSelectedDate&&dates.includes(window.mapSelectedDate)?window.mapSelectedDate:(dates[0]||'');
 window.mapSelectedDate=selected;
 const stops=t.schedule.filter(x=>x.date===selected&&x.place?.trim()).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 const modes=[['driving','車'],['walking','徒歩'],['transit','公共交通'],['bicycling','自転車']];
 c.innerHTML=`<div class="card"><h2>🗺️ 地図・移動経路</h2><p class="muted">「日程」タブで場所・住所を登録すると、日付ごとに訪問先を地図で確認できます。Googleマップが別画面で開きます。</p><label>旅行日<select id="map-date">${dates.map(d=>`<option value="${esc(d)}" ${d===selected?'selected':''}>${esc(d)}</option>`).join('')}</select></label><label>移動手段<select id="map-mode">${modes.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label><div id="map-stops">${stops.map((x,i)=>`<div class="item"><b>${i+1}. ${esc(x.time||'')} ${esc(x.title)}</b><p>${esc(x.place)}</p><a target="_blank" rel="noopener noreferrer" href="${mapsPlaceUrl(x.place)}">📍 地図で場所を見る</a></div>`).join('')||'<div class="empty">場所が登録された予定がありません。「日程」タブで場所を入力してください。</div>'}</div><button id="map-route" ${stops.length<2?'disabled':''}>🚗 この日の経路をGoogleマップで開く</button><p class="muted">時刻順に経由地を並べます。訪問先が多い日はGoogleマップの経由地上限に合わせて区間を分けてください。交通状況・移動時間はGoogleマップ側で確認できます。</p></div>`;
 document.getElementById('map-date').onchange=e=>{window.mapSelectedDate=e.target.value;render()};
 document.getElementById('map-route').onclick=()=>{
  if(stops.length<2)return;
  const mode=document.getElementById('map-mode').value;
  if(stops.length>9){alert('訪問先が多いため、最初の9か所の経路を開きます。残りは個別の地図リンクから確認してください。')}
  window.open(mapsDirectionsUrl(stops.slice(0,9),mode),'_blank','noopener,noreferrer');
 };
}
function calendarUrl(x){let d=(x.date||'').replace(/-/g,'');let start=d+'T'+(x.time||'09:00').replace(':','')+'00';let hh=+(x.time||'09:00').slice(0,2),mm=+(x.time||'09:00').slice(3,5);let end=new Date(`${x.date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00`);end.setHours(end.getHours()+1);let endstr=[end.getFullYear(),String(end.getMonth()+1).padStart(2,'0'),String(end.getDate()).padStart(2,'0')].join('')+'T'+String(end.getHours()).padStart(2,'0')+String(end.getMinutes()).padStart(2,'0')+'00';return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(x.title)+'&dates='+start+'/'+endstr+'&ctz=Asia%2FTokyo&details='+encodeURIComponent(x.note||'')+'&location='+encodeURIComponent(x.place||'')}
function renderBooking(c){c.innerHTML=`<div class="card"><h2>宿泊・交通予約</h2><form id="f"><label>種類<select name="kind"><option>ホテル</option><option>鉄道</option><option>飛行機</option><option>バス</option><option>レンタカー</option><option>その他</option></select></label>${field('date','利用日','date',true)}${field('name','施設名・便名','text',true)}${field('number','予約番号')}${field('amount','予約金額（円）','number')}${area('note','連絡先・メモ')}<button>予約を登録</button></form></div><div class="card"><h2>予約一覧</h2>${trip().bookings.map(x=>`<div class="item"><b>${esc(x.date)}　${esc(x.kind)}　${esc(x.name)}</b><p>予約番号：${esc(x.number)} ／ ¥${fmt(x.amount)}</p><p class="muted">${esc(x.note)}</p>${deleteButton('bookings',x)}</div>`).join('')||'<div class="empty">予約情報はまだありません</div>'}</div>`;$('#f').onsubmit=e=>{e.preventDefault();newItem('bookings',formData(e.target))};bindDelete()}
function renderCost(c){let t=trip(),spent=t.costs.reduce((s,x)=>s+Number(x.amount||0),0);c.innerHTML=`<div class="card"><h2>旅行費用</h2><p>予算 <b>¥${fmt(t.budget)}</b>　支出 <b>¥${fmt(spent)}</b></p><p>残り <b>¥${fmt(Number(t.budget||0)-spent)}</b></p><p class="muted">予約金額は二重計上を避けるため、費用に自動加算しません。</p><form id="f">${field('date','日付','date',true)}<label>費目<select name="category"><option>交通費</option><option>宿泊費</option><option>食費</option><option>観光</option><option>買い物</option><option>その他</option></select></label>${field('amount','金額（円）','number',true)}${field('note','内容')}<button>支出を追加</button></form></div><div class="card"><h2>支出一覧</h2>${t.costs.map(x=>`<div class="item"><b>${esc(x.date)}　${esc(x.category)}　¥${fmt(x.amount)}</b><p class="muted">${esc(x.note)}</p>${deleteButton('costs',x)}</div>`).join('')||'<div class="empty">支出はまだありません</div>'}</div>`;$('#f').onsubmit=e=>{e.preventDefault();newItem('costs',formData(e.target))};bindDelete()}
function renderDiary(c){
 const currentTrip=trip();
 const schedule=[...currentTrip.schedule].sort((a,b)=>(a.date+' '+a.time).localeCompare(b.date+' '+b.time));
 const titlePicker=schedule.length?`<label>日程からタイトルを選ぶ<select id="diary-title-picker">
  <option value="">予定・観光地を選択</option>

 document.getElementById('save-client-id').onclick=()=>{let v=document.getElementById('google-client-id').value.trim();if(v&&!/^[^\s]+\.apps\.googleusercontent\.com$/.test(v))return alert('Google OAuthクライアントIDの形式を確認してください');localStorage.setItem(clientIdKey,v);googleToken='';googleExpires=0;googleTokenClient=null;setSyncStatus('クライアントIDを保存しました。Googleアカウントに接続してください。');render()};

function connectGoogle(){
 const cid=getClientId();if(!cid)return alert('先にGoogle OAuthクライアントIDを保存してください');
 if(!window.google?.accounts?.oauth2)return alert('Googleの認証ライブラリを読み込めません。インターネット接続を確認してください。');
 try{
 googleTokenClient=google.accounts.oauth2.initTokenClient({client_id:cid,scope:GOOGLE_SCOPE,callback:async response=>{
 if(response.error)return setSyncStatus('Google接続エラー: '+response.error);

 setSyncStatus('Googleアカウントに接続しました');render();await syncGoogle();
 }});

async function googleRequest(method,path,body){
 if(!googleToken||Date.now()>=googleExpires)throw Error('Google接続の有効期限が切れました。「Googleアカウントに接続」から再接続してください。');
 const response=await fetch(GOOGLE_API+path,{method,headers:{Authorization:'Bearer '+googleToken,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
 if(!response.ok){let data=await response.json().catch(()=>({}));throw Error(data.error?.message||'Google APIエラー: '+response.status)}
 if(response.status===204)return null;return response.json();
}
function eventFromItem(t,x){
 const start=new Date(`${x.date}T${x.time||'09:00'}:00`);
 if(Number.isNaN(start.getTime()))throw Error('日程に不正な日付があります');
 const end=new Date(start.getTime()+60*60*1000);
 const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:00`;
 return {summary:x.title,description:x.note||'',location:x.place||'',start:{dateTime:localDate(start),timeZone:'Asia/Tokyo'},end:{dateTime:localDate(end),timeZone:'Asia/Tokyo'},extendedProperties:{private:{tabiplanner:'1',tripId:t.id,itemId:x.id}}};
}
function applyRemote(x,event){
 const dateTime=event.start?.dateTime;if(!dateTime)return;
 // Google API ISO timestamps include the local wall clock in the first 16 characters.
 x.date=dateTime.slice(0,10);x.time=dateTime.slice(11,16);x.title=event.summary||'無題';x.place=event.location||'';x.note=event.description||'';
 x.googleUpdated=event.updated;x.modifiedAt=event.updated;
}
async function syncGoogle(){
 if(syncBusy||driveBusy)return;
 if(!googleToken||Date.now()>=googleExpires){setSyncStatus('未接続または接続期限切れです。再接続してください。');return}
 syncBusy=true;setSyncStatus('同期中…');let created=0,updated=0,imported=0,deleted=0;
 try{
 // Query only app-owned events; fetch all pages.
 let events=[],pageToken='';do{
 const params=new URLSearchParams({'privateExtendedProperty':'tabiplanner=1',maxResults:'250',showDeleted:'false'});if(pageToken)params.set('pageToken',pageToken);
 const result=await googleRequest('GET','/calendars/primary/events?'+params.toString());events.push(...(result.items||[]));pageToken=result.nextPageToken||'';
 }while(pageToken);
 const byKey=new Map(events.filter(e=>e.extendedProperties?.private?.tripId&&e.extendedProperties?.private?.itemId).map(e=>[e.extendedProperties.private.tripId+'|'+e.extendedProperties.private.itemId,e]));
 const byId=new Map(events.map(e=>[e.id,e]));
 // Deleted app events queued by the local UI.
 state.syncDeletes=state.syncDeletes||[];
 for(const tomb of [...state.syncDeletes]){
 if(byId.has(tomb.eventId)){await googleRequest('DELETE','/calendars/primary/events/'+encodeURIComponent(tomb.eventId));deleted++;byId.delete(tomb.eventId)}
 state.syncDeletes=state.syncDeletes.filter(z=>z!==tomb);save();
 }
 for(const t of state.trips){
 for(const x of t.schedule){
 const remote=byKey.get(t.id+'|'+x.id);
 if(remote){
 x.googleEventId=remote.id;
 const remoteTime=Date.parse(remote.updated||0)||0;
 const lastRemoteTime=Date.parse(x.googleUpdated||0)||0;
 const localTime=Date.parse(x.modifiedAt||0)||0;
 // Remote edit after last known version: prefer remote unless local was edited later.
 if(remoteTime>lastRemoteTime+1000 && remoteTime>localTime+1000){applyRemote(x,remote);imported++}
 else if(localTime>lastRemoteTime+1000){const result=await googleRequest('PATCH','/calendars/primary/events/'+encodeURIComponent(remote.id),eventFromItem(t,x));x.googleUpdated=result.updated;x.modifiedAt=result.updated;updated++}
 else if(!x.googleUpdated){x.googleUpdated=remote.updated}
 }else{

 if(x.googleEventId)continue;
 const result=await googleRequest('POST','/calendars/primary/events',eventFromItem(t,x));x.googleEventId=result.id;x.googleUpdated=result.updated;x.modifiedAt=result.updated;created++;
 }

 }
 }

 }catch(e){setSyncStatus('同期エラー: '+e.message)}finally{syncBusy=false;scheduleDrive()}
}

let driveStatus='未接続';
let driveKey='';
const driveConnected=()=>!!driveToken&&Date.now()<driveExpires;
const travelData=()=>JSON.stringify(state.trips);
const syncStamp=()=>new Date().toLocaleTimeString('ja-JP');

function showDriveStatus(message,conflict=false){
 driveStatus=message;
 driveConflict=conflict;
 const status=document.getElementById('drive-status');
 if(status)status.textContent=message;
 const actions=document.getElementById('drive-conflict');
 if(actions)actions.hidden=!conflict;
}

function connectDrive(){
 const cid=getClientId();
 if(!cid)return showDriveStatus('先にGoogle OAuthクライアントIDを保存してください。');
 if(!window.google?.accounts?.oauth2)return showDriveStatus('Google認証を読み込めませんでした。');
 const oauth=google.accounts.oauth2;
 oauth.initTokenClient({
  client_id:cid,scope:DRIVE_SCOPE,include_granted_scopes:false,
  callback:async response=>{
   if(response.error)return showDriveStatus('接続エラー：'+response.error);
   if(!oauth.hasGrantedAllScopes(response,DRIVE_SCOPE))return showDriveStatus('Google Driveへのアクセスを許可してください。');
   driveToken=response.access_token;
   driveExpires=Date.now()+(Number(response.expires_in)||3600)*1000-60000;
   driveKey='';
   showDriveStatus('接続しました。同期中…');
   render();
   await syncDrive();
  },
  error_callback:()=>showDriveStatus('Googleの接続画面を開けませんでした。')
 }).requestAccessToken({prompt:'select_account'});
}

async function driveRequest(path,options={}){
 if(!driveConnected())throw Error('Google Driveに再接続してください。');
 const response=await fetch(DRIVE_API+path,{
  ...options,headers:{...options.headers,Authorization:'Bearer '+driveToken},
  signal:AbortSignal.timeout(30000)
 });
 if(!response.ok)throw Error((await response.json().catch(()=>({}))).error?.message||'Google Drive エラー '+response.status);
 return response.json();
}

async function driveHistory(){
 const files=[];
 let pageToken;
 do{
  const params=new URLSearchParams({
   spaces:'appDataFolder',q:"name = '"+DRIVE_NAME+"' and trashed = false",
   fields:'nextPageToken,files(id,appProperties,createdTime)',pageSize:'1000'
  });
  if(pageToken)params.set('pageToken',pageToken);
  const page=await driveRequest('/drive/v3/files?'+params);
  files.push(...(page.files||[]));
  pageToken=page.nextPageToken;
 }while(pageToken);
 const ancestors=new Set(files.flatMap(file=>(file.appProperties?.parents||'').split(',')));
 return files.filter(file=>!ancestors.has(file.id)).sort((a,b)=>b.createdTime.localeCompare(a.createdTime)||b.id.localeCompare(a.id));
}

async function uploadTravelSnapshot(trips,heads){
 const parents=heads.map(file=>file.id).join(',');
 if(parents.length>115)throw Error('複数の変更が競合しています。現在のデータをバックアップしてください。');
 const boundary='tabiplanner_'+crypto.randomUUID();
 const metadata={name:DRIVE_NAME,parents:['appDataFolder'],appProperties:parents?{parents}:{}};
 const body=new Blob([
  '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n',
  JSON.stringify(metadata),'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n',
  '{"trips":'+trips+'}','\r\n--'+boundary+'--\r\n'
 ]);
 return driveRequest('/upload/drive/v3/files?uploadType=multipart&fields=id',{
  method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body
 });
}

async function readTravelSnapshot(id){
 const data=await driveRequest('/drive/v3/files/'+encodeURIComponent(id)+'?alt=media');
 if(!Array.isArray(data.trips)||!data.trips.every(t=>t&&typeof t.id==='string'&&
  ['schedule','bookings','costs','diary','packing'].every(key=>Array.isArray(t[key])))){
  throw Error('Driveの旅行データを読み取れませんでした。');
 }
 return data.trips;
}

async function syncDrive(choice){
 if(driveBusy||syncBusy)return;
 if(!driveConnected()){
  if(driveToken)showDriveStatus('接続期限が切れました。Google Driveに再接続してください。');
  return;
 }
 driveBusy=true;
 const token=driveToken;
 try{
  if(!driveKey){
   const account=await driveRequest('/drive/v3/about?fields=user(permissionId)');
   if(!account.user?.permissionId)throw Error('Googleアカウントを確認できませんでした。');
   driveKey='tabiplanner-drive-base-'+account.user.permissionId;
  }
  const heads=await driveHistory();
  const base=JSON.parse(localStorage.getItem(driveKey)||'null');
  const current=travelData();
  const digest=async body=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(body))),b=>b.toString(16).padStart(2,'0')).join('');
  const currentHash=await digest(current);
  const head=heads[0];
  const remote=head?await readTravelSnapshot(head.id):null;
  if(token!==driveToken||current!==travelData())return;
  const remoteText=remote&&JSON.stringify(remote);
  const remember=(id,body)=>localStorage.setItem(driveKey,JSON.stringify({id,hash:body}));
  if(!choice&&(heads.length>1||(head&&remoteText!==current&&
    (base?base.id!==head.id&&base.hash!==currentHash:state.trips.length>0)))){
   showDriveStatus('PCとスマホに異なる旅行データがあります。両方の端末でバックアップを保存してから、使うデータを選んでください。',true);
   return;
  }
  if(heads.length===1&&remoteText===current){
   remember(head.id,currentHash);
  }else if(head&&(choice==='drive'||(!choice&&base?.id!==head.id&&(base?base.hash===currentHash:state.trips.length===0)))){
   const selected=state.active;
   const previous=state.trips;
   state.trips=remote;
   if(!remote.some(t=>t.id===selected))state.active=remote[0]?.id||null;
   if(!save()){state.trips=previous;state.active=selected;throw Error('端末に保存できませんでした。');}
   if(heads.length>1){
    const file=await uploadTravelSnapshot(remoteText,heads);
    remember(file.id,await digest(remoteText));
   }else remember(head.id,await digest(remoteText));
   if(tab==='旅行'){showDriveStatus('端末間の同期完了（'+syncStamp()+'）');render();}
   else showDriveStatus('旅行データを受信しました。表示中のタブを開き直すと確認できます。');
   return;
  }else if(!head&&state.trips.length===0&&!choice){
   showDriveStatus('接続済み。旅行を登録すると同期します。');
   return;
  }else{
   const file=await uploadTravelSnapshot(current,heads);
   remember(file.id,currentHash);
  }
  showDriveStatus('端末間の同期完了（'+syncStamp()+'）');
 }catch(error){
  showDriveStatus('端末間の同期エラー：'+error.message,driveConflict);
 }finally{
  driveBusy=false;
 }
}

function scheduleDrive(){
 if(!driveConnected()||driveBusy||driveConflict)return;
 clearTimeout(drivePending);
 drivePending=setTimeout(()=>syncDrive(),1000);
}

window.addEventListener('focus',()=>setTimeout(()=>syncDrive(),1500));
setInterval(()=>syncDrive(),30000);

render();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.warn)); }
</script></body></html>
